aid: andon-health
name: Andon Health
description: >-
  Andon Health Co., Ltd. is a Tianjin, China-based medical device manufacturer,
  best known globally through its iHealth brand and its US subsidiary iHealth
  Labs Inc (founded 2010). The company designs connected consumer health
  hardware — wireless blood pressure monitors, smart glucose monitors, pulse
  oximeters, body-composition scales, infrared thermometers, and at-home rapid
  antigen tests (COVID-19, flu, RSV) — paired with the iHealth mobile apps and
  the iHealth Cloud. For developers, Andon Health/iHealth publishes the iHealth
  Open API V2, an OAuth 2.0-authorized REST API on api.ihealthlabs.com that lets
  third-party applications read a consenting user's device measurements (blood
  pressure and user profile resources are confirmed). The corporate
  andonhealth.com domain is currently parked/for-sale; the live surfaces are the
  ihealthlabs.com storefront, cloud.ihealthlabs.com, and the iHealth Developer
  Portal at developer.ihealthlabs.com.
